name: Validate Terai web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Flutter tests and release web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run Flutter tests
        run: flutter test --no-pub
      - name: Compile release web app (validation only)
        run: >-
          flutter build web --release --no-pub
          --dart-define=SUPABASE_URL=https://qddhubtyvqoqlbshxfkr.supabase.co
          --dart-define=SUPABASE_ANON_KEY=ci-public-key-placeholder
